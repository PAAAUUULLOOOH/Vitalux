name: Vitalux – Rolling Unstable

on:
  workflow_dispatch:
  push:
    branches: [unstable]

permissions:
  contents: write

concurrency:
  group: vitalux-rolling-unstable
  cancel-in-progress: false

jobs:
  test-and-publish:
    if: github.ref == 'refs/heads/unstable'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Number the test build on the permanent branch
        id: prepare
        run: |
          set -euo pipefail
          git config user.name PAAAUUULLOOOH
          git config user.email PAAAUUULLOOOH@users.noreply.github.com
          # Checkout the current branch tip after any earlier queued build.
          git pull --ff-only origin refs/heads/unstable
          git fetch origin refs/heads/main:refs/remotes/origin/main
          CHANGED="$(python -c 'import sys; sys.path.insert(0,"scripts"); from channel_metadata import describe; print(str(describe()["has_test_changes"]).lower())')"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [[ "$CHANGED" != true ]]; then
            exit 0
          fi
          VERSION="$(python scripts/prepare-unstable-build.py)"
          git add vitalux/__init__.py CHANGELOG.md CHANGELOG.en.md
          git commit -m "Prepare Unstable test build v$VERSION"
          git push origin HEAD:refs/heads/unstable
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          python scripts/release_notes.py "$VERSION" "$RUNNER_TEMP/unstable-notes.md"
      - name: Install pinned Python dependencies
        id: python_deps
        timeout-minutes: 8
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/setup
          python -m pip install --timeout 60 --retries 2 -r requirements-dev.txt 2>&1 | tee build/setup/python.log
      - name: Refresh signed Ubuntu package indexes
        id: ubuntu_index
        timeout-minutes: 4
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/setup
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update 2>&1 | tee build/setup/ubuntu-index.log
      - name: Install virtual desktop dependencies
        id: desktop_deps
        timeout-minutes: 10
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/setup
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y --no-install-recommends xvfb weston libegl1 libgl1 libopengl0 libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-util1 libxcb-shape0 curl squashfs-tools unzip file 2>&1 | tee build/setup/desktop.log
      - name: Expose dependency setup failures
        if: failure() && (steps.python_deps.outcome == 'failure' || steps.ubuntu_index.outcome == 'failure' || steps.desktop_deps.outcome == 'failure')
        run: |
          python - <<'PY'
          from pathlib import Path
          for log in sorted(Path('build/setup').glob('*.log')):
              tail = '\n'.join(log.read_text(errors='replace').splitlines()[-30:])
              detail = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Dependency setup {log.name}::{detail}', flush=True)
          PY
      - name: Compile sources and launchers
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python -m compileall -q vitalux tests scripts packaging
          bash -n run.sh packaging/AppRun
      - name: Assemble and validate the portable runtime
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python scripts/prepare-release.py "build/staged/Vitalux-${TAG}"
          python scripts/check-distribution.py "build/staged/Vitalux-${TAG}"
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          cd "$STAGED"
          LD_LIBRARY_PATH="$STAGED/lib" "$STAGED/runtime/bin/python3.12" scripts/run-regressions.py --output "$GITHUB_WORKSPACE/build/regressions"
      - name: Exercise real kernel and desktop paths
        if: steps.prepare.outputs.changed == 'true'
        id: native
        run: |
          set -euo pipefail
          sudo env VITALUX_NETWORK_TEST_VM=1 /usr/bin/python3 scripts/check-network-kernel.py | tee build/network-kernel.log
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          cd "$STAGED"
          LD_LIBRARY_PATH="$STAGED/lib" "$STAGED/runtime/bin/python3.12" scripts/run-graphics-checks.py --output "$GITHUB_WORKSPACE/build/graphics-checks"
          for DESIGN in obsidian_gold aether_glass eclipse_crystal liquid_silver black_glass_gold nebula_prism quantum_core; do
            LD_LIBRARY_PATH="$STAGED/lib" "$STAGED/runtime/bin/python3.12" scripts/capture-release-ui.py --output "$GITHUB_WORKSPACE/build/ui-scale-checks/$DESIGN" --design "$DESIGN" --scales 1,1.25,1.5,2
          done
      - name: Expose native validation failures
        if: failure() && steps.native.outcome == 'failure'
        run: |
          python - <<'PY'
          from pathlib import Path
          for folder in ('build/graphics-checks', 'build/ui-scale-checks'):
              for log in sorted(Path(folder).rglob('*.log')):
                  tail = '\n'.join(log.read_text(errors='replace').splitlines()[-24:])
                  escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title={log.name}::{escaped}', flush=True)
          PY
      - name: Verify offline source ZIP startup
        if: steps.prepare.outputs.changed == 'true'
        run: python scripts/check-source-preview.py
      - name: Build the full ZIP and AppImage
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p tooling dist
          curl -fL --retry 3 --silent --show-error https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o tooling/appimagetool.AppImage
          chmod 755 tooling/appimagetool.AppImage
          (cd tooling && ./appimagetool.AppImage --appimage-extract >/dev/null)
          python scripts/create-release-archives.py "build/staged/Vitalux-${TAG}" dist --full-only
          bash packaging/build-appimage.sh "build/staged/Vitalux-${TAG}" "$PWD/dist/Vitalux-${TAG}-x86_64.AppImage" "$PWD/tooling/squashfs-root/AppRun"
      - uses: actions/cache@v4
        if: steps.prepare.outputs.changed == 'true'
        with:
          path: build/third-party-sources
          key: vitalux-third-party-sources-v1-${{ hashFiles('third_party/sources.lock.json') }}
      - name: Bundle licenses, source offers and checksums
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python scripts/bundle-third-party.py --runtime-root "build/staged/Vitalux-${TAG}" --output dist
          (cd dist && sha256sum *.AppImage *.zip > "Vitalux-${TAG}-SHA256SUMS.txt")
          unzip -tq "dist/Vitalux-${TAG}-linux-x86_64.zip"
      - name: Preserve validation and build outputs
        if: always() && steps.prepare.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Vitalux-Unstable-${{ env.TAG }}
          path: |
            build/setup/
            build/regressions/
            build/graphics-checks/
            build/ui-scale-checks/
            build/network-kernel.log
            dist/
          retention-days: 14
      - name: Update the single rolling prerelease
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-unstable.py dist
      - name: Mark a caught-up test channel without building a Stable mirror
        if: steps.prepare.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/refresh-unstable-channel.py
