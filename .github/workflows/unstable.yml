name: Vitalux – Rolling Unstable

on:
  workflow_dispatch:
  push:
    branches: [unstable]

permissions:
  contents: write

concurrency:
  group: vitalux-rolling-unstable
  cancel-in-progress: false

jobs:
  test-and-publish:
    if: github.ref == 'refs/heads/unstable'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Number the test build on the permanent branch
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/setup
          exec > >(tee build/setup/version.log) 2>&1
          git config user.name PAAAUUULLOOOH
          git config user.email PAAAUUULLOOOH@users.noreply.github.com
          # Checkout the current branch tip after any earlier queued build.
          git pull --ff-only origin refs/heads/unstable
          git fetch origin refs/heads/main:refs/remotes/origin/main
          CHANGED="$(python -c 'import sys; sys.path.insert(0,"scripts"); from channel_metadata import describe; print(str(describe()["has_test_changes"]).lower())')"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [[ "$CHANGED" != true ]]; then
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/unstable" --jq '.assets[].name' > build/setup/published-assets.txt
          VERSION="$(python scripts/prepare-unstable-build.py --published-assets build/setup/published-assets.txt)"
          git add vitalux/__init__.py CHANGELOG.md CHANGELOG.en.md
          if ! git diff --cached --quiet; then
            git commit -m "Prepare Unstable test build v$VERSION"
            git push origin HEAD:refs/heads/unstable
          fi
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          python scripts/release_notes.py "$VERSION" "$RUNNER_TEMP/unstable-notes.md"
      - name: Select expensive checks from the published baseline
        id: validation
        if: steps.prepare.outputs.changed == 'true'
        run: python scripts/validation_plan.py --github-output "$GITHUB_OUTPUT"
      - name: Install pinned Python dependencies
        id: python_deps
        timeout-minutes: 8
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/setup
          python -m pip install --timeout 60 --retries 2 -r requirements-dev.txt 2>&1 | tee build/setup/python.log
      - name: Refresh signed Ubuntu package indexes
        id: ubuntu_index
        timeout-minutes: 4
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/setup
          sudo dpkg --add-architecture i386
          # Use the official HTTPS mirrors; the runner's Azure mirror can stall.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update 2>&1 | tee build/setup/ubuntu-index.log
      - name: Install virtual desktop dependencies
        id: desktop_deps
        timeout-minutes: 10
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/setup
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y --no-install-recommends xvfb weston libegl1 libgl1 libopengl0 libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-util1 libxcb-shape0 curl squashfs-tools unzip file mesa-utils xdotool flatpak g++-multilib libx11-dev libx11-dev:i386 libgl-dev libgl-dev:i386 libvulkan-dev libvulkan-dev:i386 libgl1-mesa-dri:i386 libglx-mesa0:i386 mesa-vulkan-drivers:i386 2>&1 | tee build/setup/desktop.log
      - name: Expose dependency setup failures
        if: failure() && (steps.prepare.outcome == 'failure' || steps.python_deps.outcome == 'failure' || steps.ubuntu_index.outcome == 'failure' || steps.desktop_deps.outcome == 'failure')
        run: |
          python - <<'PY'
          from pathlib import Path
          for log in sorted(Path('build/setup').glob('*.log')):
              tail = '\n'.join(log.read_text(errors='replace').splitlines()[-30:])
              detail = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Dependency setup {log.name}::{detail}', flush=True)
          PY
      - name: Compile sources and launchers
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python -m compileall -q vitalux tests scripts packaging
          bash -n run.sh packaging/AppRun
          python tests/test_desktop_runtime.py
      - name: Check bundled OpenGL and Vulkan game recording in both architectures
        if: steps.prepare.outputs.changed == 'true' && steps.validation.outputs.overlay == 'true'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x800x24' python scripts/check-game-recording.py --output build/game-recording
          xvfb-run -a -s '-screen 0 1280x800x24' python scripts/check-game-start.py --probe build/game-recording/graphics-probe64 --output build/game-start
      - name: Check bundled overlay inside a real Flatpak sandbox
        if: steps.prepare.outputs.changed == 'true' && steps.validation.outputs.overlay == 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir -p build/flatpak-recording
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/check-flatpak-game-recording.sh build/flatpak-recording
      - name: Assemble and validate the portable runtime
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python scripts/prepare-release.py "build/staged/Vitalux-${TAG}"
          python scripts/check-distribution.py "build/staged/Vitalux-${TAG}"
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          cd "$STAGED"
          LD_LIBRARY_PATH="$STAGED/lib" "$STAGED/runtime/bin/python3.12" scripts/run-regressions.py --output "$GITHUB_WORKSPACE/build/regressions"
      - name: Start Qt in a minimal Linux base without extra installed libraries
        if: steps.prepare.outputs.changed == 'true'
        timeout-minutes: 4
        run: python scripts/check-minimal-runtime.py "build/staged/Vitalux-${TAG}" --output build/minimal-runtime
      - name: Check the overlay inside Valve's Steam runtime
        if: steps.prepare.outputs.changed == 'true' && steps.validation.outputs.overlay == 'true'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p build/steam-recording
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/check-steam-game-recording.sh build/steam-recording
      - name: Check wide Steam capsules and offline reuse
        if: steps.prepare.outputs.changed == 'true' && steps.validation.outputs.game_artwork == 'true'
        run: python scripts/check-game-artwork-network.py
      - name: Check native header search, translucent dock and interrupted appearance transitions
        if: steps.prepare.outputs.changed == 'true' && steps.validation.outputs.navigation == 'true'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1600x1050x24' env QT_QPA_PLATFORM=xcb VITALUX_RENDERER=x11_opengl LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=2 python tests/test_navigation_surfaces.py
      - name: Check resource budgets, endurance and reference rendering
        if: steps.prepare.outputs.changed == 'true' && steps.validation.outputs.resources == 'true'
        timeout-minutes: 18
        run: |
          set -euo pipefail
          python scripts/check-resource-budgets.py
          python scripts/check-ui-endurance.py --cycles 180 --output build/ui-endurance
          git worktree add --detach build/render-reference 5bcc1e90a69f3f58f1de582db0b5eeec5b0e4332
          python scripts/check-render-parity.py --reference build/render-reference --output build/render-parity
          git worktree remove build/render-reference
          git worktree add --detach build/performance-reference 1a74b85a6ff427ca2e7cf672e26b2efe0f6ca6e8
          python scripts/check-performance-render.py --reference build/performance-reference --output build/performance-parity
          git worktree remove build/performance-reference
      - name: Check manufacturer images, specifications and translations in isolated profiles
        if: steps.prepare.outputs.changed == 'true' && steps.validation.outputs.hardware_network == 'true'
        timeout-minutes: 11
        run: python scripts/check-hardware-network.py
      - name: Exercise real kernel and desktop paths
        if: steps.prepare.outputs.changed == 'true'
        id: native
        run: |
          set -euo pipefail
          if [[ '${{ steps.validation.outputs.kernel }}' == true ]]; then
            sudo env VITALUX_NETWORK_TEST_VM=1 /usr/bin/python3 scripts/check-network-kernel.py | tee build/network-kernel.log
          fi
          if [[ '${{ steps.validation.outputs.graphics }}' != true ]]; then exit 0; fi
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          cd "$STAGED"
          LD_LIBRARY_PATH="$STAGED/lib" "$STAGED/runtime/bin/python3.12" scripts/run-graphics-checks.py --output "$GITHUB_WORKSPACE/build/graphics-checks"
          for DESIGN in obsidian_gold glass light nebula_prism quantum_core crystal_atrium eclipse_crystal aurora_bloom minimal; do
            LD_LIBRARY_PATH="$STAGED/lib" "$STAGED/runtime/bin/python3.12" scripts/capture-release-ui.py --output "$GITHUB_WORKSPACE/build/ui-scale-checks/$DESIGN" --design "$DESIGN" --scales 1,1.25,1.5,2
          done
      - name: Expose native validation failures
        if: failure() && steps.native.outcome == 'failure'
        run: |
          python - <<'PY'
          from pathlib import Path
          for folder in ('build/graphics-checks', 'build/ui-scale-checks'):
              for log in sorted(Path(folder).rglob('*.log')):
                  tail = '\n'.join(log.read_text(errors='replace').splitlines()[-24:])
                  escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title={log.name}::{escaped}', flush=True)
          PY
      - name: Verify offline source ZIP startup
        if: steps.prepare.outputs.changed == 'true' && steps.validation.outputs.source_startup == 'true'
        run: python scripts/check-source-startup.py
      - uses: actions/cache@v4
        if: steps.prepare.outputs.changed == 'true'
        with:
          path: tooling/appimagetool.AppImage
          key: vitalux-appimagetool-x86_64-v1
      - name: Build the full ZIP and AppImage
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python scripts/finalize-package.py "build/staged/Vitalux-${TAG}"
          python scripts/check-distribution.py "build/staged/Vitalux-${TAG}"
          mkdir -p tooling dist
          if [[ ! -s tooling/appimagetool.AppImage ]]; then
            curl -fL --retry 3 --silent --show-error https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o tooling/appimagetool.AppImage
          fi
          chmod 755 tooling/appimagetool.AppImage
          (cd tooling && ./appimagetool.AppImage --appimage-extract >/dev/null)
          python scripts/create-release-archives.py "build/staged/Vitalux-${TAG}" dist --full-only
          bash packaging/build-appimage.sh "build/staged/Vitalux-${TAG}" "$PWD/dist/Vitalux-${TAG}-x86_64.AppImage" "$PWD/tooling/squashfs-root/AppRun"
      - uses: actions/cache@v4
        if: steps.prepare.outputs.changed == 'true'
        with:
          path: build/third-party-sources
          key: vitalux-third-party-sources-v1-${{ hashFiles('third_party/sources.lock.json') }}
      - name: Bundle licenses, source offers and checksums
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python scripts/bundle-third-party.py --runtime-root "build/staged/Vitalux-${TAG}" --output dist
          (cd dist && sha256sum *.AppImage *.zip > "Vitalux-${TAG}-SHA256SUMS.txt")
          unzip -tq "dist/Vitalux-${TAG}-linux-x86_64.zip"
      - name: Preserve validation and build outputs
        if: always() && steps.prepare.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Vitalux-Unstable-${{ env.TAG }}
          path: |
            build/setup/
            build/regressions/
            build/game-recording/
            build/game-start/
            build/minimal-runtime/
            build/flatpak-recording/recording/
            build/flatpak-recording/runtime-list.txt
            build/steam-recording/recording/
            build/steam-recording/runtime-source.json
            build/game-artwork-network/
            build/performance-parity/results.json
            build/performance-parity/approved-appearance-captures.json
            build/performance-parity/**/current/*-overview.png
            build/render-parity/results.json
            build/ui-endurance/
            build/graphics-checks/
            build/hardware-network/
            build/product-image-check
            build/product-spec-check/
            build/spec-language-check/
            build/ui-scale-checks/
            build/network-kernel.log
            dist/
          retention-days: 14
      - name: Update the single rolling prerelease
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-unstable.py dist
      - name: Mark a caught-up test channel without building a Stable mirror
        if: steps.prepare.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/refresh-unstable-channel.py
