name: Vitalux – Experimentelle Designvorschau

on:
  push:
    branches: ['experimental/glass-gold-preview']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitalux-design-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-preview:
    if: github.ref == 'refs/heads/experimental/glass-gold-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native Qt-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 fonts-dejavu-core
          python -m pip install --only-binary=:all: 'PySide6==6.12.0' 'psutil==7.2.2'
      - name: Laufzeit prüfen, Regressionen ausführen und vollständige Test-ZIP bauen
        run: python scripts/build-design-preview.py
      - name: Code-Download ohne installiertes Python starten
        run: python scripts/check-source-preview.py
      - name: Test-ZIP und Bildschirmaufnahmen bereitstellen
        id: download
        uses: actions/upload-artifact@v4
        with:
          name: Vitalux-v0.9.5.4-Designvorschau-linux-x86_64
          path: dist/design-preview/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Download im Build-Bericht verlinken
        env:
          PREVIEW_ARTIFACT_URL: ${{ steps.download.outputs.artifact-url }}
        run: |
          printf '### Vitalux – Designvorschau\n\n[Test-ZIP herunterladen](%s)\n\nEntpacken und `bash Designs-testen.sh` starten.\n' "$PREVIEW_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Prüfprotokolle bei einem Fehler sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-preview-pruefprotokolle
          path: |
            build/design-preview-checks/
            build/source-preview-checks/
          if-no-files-found: ignore
