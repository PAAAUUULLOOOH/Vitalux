name: Vitalux Holographic – Portable Testversion

# Temporäre Testbuilds auf dem Entwicklungszweig. Keine Releases oder Tags.
on:
  push:
    branches:
      - feature/holographic-native-hud
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Vitalux-Entwicklungszweig abrufen
        uses: actions/checkout@v4

      - name: Vorhandene portable Laufzeit von Vitalux übernehmen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/baseline build/staged dist
          gh release download v0.9.3.82             --repo PAAAUUULLOOOH/Vitalux-Archiv             --pattern Vitalux-v0.9.3.82-linux-x86_64.zip             --dir build
          unzip -tq build/Vitalux-v0.9.3.82-linux-x86_64.zip
          unzip -q build/Vitalux-v0.9.3.82-linux-x86_64.zip -d build/baseline
          test -x build/baseline/Vitalux-v0.9.3.82/runtime/bin/python3.12

      - name: Aktuelle Holographic-App mit Laufzeit zu einer portablen Version zusammenstellen
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="build/baseline/Vitalux-v0.9.3.82"
          TARGET="build/staged/Vitalux-v0.9.4.0-Holographic-Test"
          cp -a "$SOURCE" "$TARGET"
          rm -rf "$TARGET/vitalux" "$TARGET/assets" "$TARGET/.github"
          cp -a vitalux assets "$TARGET/"
          cp README.md run.sh Portable-pruefen.sh CHANGELOG.md CHANGELOG.en.md "$TARGET/"
          mkdir -p "$TARGET/bin" "$TARGET/packaging"
          cp bin/fio "$TARGET/bin/fio"
          rm -f "$TARGET/bin/vitalux-gpu-engine" "$TARGET/packaging/vitalux-gpu-service.py" "$TARGET/LICENSES/LACT-MIT.txt"
          cp packaging/build-appimage.sh "$TARGET/packaging/build-appimage.sh"
          find "$TARGET" -type d -name __pycache__ -prune -exec rm -rf {} +
          chmod +x "$TARGET/run.sh" "$TARGET/Portable-pruefen.sh"
          python3 -m compileall -q vitalux
          test -f "$TARGET/vitalux/holographic.py"
          test -x "$TARGET/runtime/bin/python3.12"
          test -f "$TARGET/bin/fio.real"

      - name: OpenGL und Qt Quick nach Möglichkeit vollständig bündeln
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0
          TARGET="$PWD/build/staged/Vitalux-v0.9.4.0-Holographic-Test"
          PY="$TARGET/runtime/bin/python3.12"
          LIB="$TARGET/lib"
          if ! LD_LIBRARY_PATH="$LIB" "$PY" -c 'from PySide6.QtOpenGLWidgets import QOpenGLWidget' 2>/dev/null; then
            V="$(LD_LIBRARY_PATH="$LIB" "$PY" -c 'import PySide6; print(PySide6.__version__)')"
            mkdir -p build/addons
            python3 -m pip download --only-binary=:all: --no-deps "PySide6_Essentials==${V}" -d build/addons
            WHEEL="$(find build/addons -maxdepth 1 -type f -name '*.whl' -print -quit)"
            test -n "$WHEEL"
            python3 scripts/bundle-opengl-runtime.py "$WHEEL" "$TARGET"
          fi
          if ! LD_LIBRARY_PATH="$LIB" "$PY" -c 'from PySide6.QtQuickWidgets import QQuickWidget; from PySide6.QtQuick import QQuickImageProvider' 2>/dev/null; then
            V="$(LD_LIBRARY_PATH="$LIB" "$PY" -c 'import PySide6; print(PySide6.__version__)')"
            mkdir -p build/addons
            WHEEL="$(find build/addons -maxdepth 1 -type f -name '*essentials*.whl' -print -quit)"
            if [[ -z "$WHEEL" ]]; then
              python3 -m pip download --only-binary=:all: --no-deps "PySide6_Essentials==${V}" -d build/addons
              WHEEL="$(find build/addons -maxdepth 1 -type f -name '*.whl' -print -quit)"
            fi
            test -n "$WHEEL"
            python3 scripts/bundle-quick-runtime.py "$WHEEL" "$TARGET"
          fi
          LD_LIBRARY_PATH="$LIB" "$PY" -c 'from PySide6.QtOpenGLWidgets import QOpenGLWidget; from PySide6.QtQuickWidgets import QQuickWidget'

      - name: Native GUI und Holographic wirklich testen
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: ${{ runner.temp }}/vitalux-holo-test-config
        run: |
          set -euo pipefail
          TARGET="$PWD/build/staged/Vitalux-v0.9.4.0-Holographic-Test"
          mkdir -p "$XDG_CONFIG_HOME"
          cd "$TARGET"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_holographic_theme.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_protected_accents.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_glass_theme_switch.py"

      - name: Vollversion und optionales Dateisystem-Update packen
        shell: bash
        run: |
          set -euo pipefail
          cd build/staged
          zip -qr ../../dist/Vitalux-v0.9.4.0-Holographic-Test-linux-x86_64.zip Vitalux-v0.9.4.0-Holographic-Test
          cd ../..
          mkdir -p build/update/Vitalux-v0.9.4.0-Holographic-Test
          cp -a vitalux assets build/update/Vitalux-v0.9.4.0-Holographic-Test/
          cp README.md CHANGELOG.md CHANGELOG.en.md run.sh Portable-pruefen.sh build/update/Vitalux-v0.9.4.0-Holographic-Test/
          cat > build/update/ANLEITUNG.txt <<'EOF'
          Holographic Test-Update fuer die PORTABLE Version v0.9.3.82:
          Dies ist KEIN automatisches Update.
          Fuer eine sichere Probe bevorzugt die separat gepackte Vollversion nutzen.
          Alternativ zuerst die vorhandene portable Installation sichern,
          dann die Inhalte des Ordners Vitalux-v0.9.4.0-Holographic-Test
          in den Ordner der entpackten v0.9.3.82 kopieren und ersetzen.
          EOF
          cd build/update
          zip -qr ../../dist/Vitalux-v0.9.4.0-Holographic-Test-Update-von-v0.9.3.82.zip .
          cd ../..
          (cd dist && sha256sum *.zip > Vitalux-v0.9.4.0-Holographic-Test-SHA256SUMS.txt)
          unzip -tq dist/Vitalux-v0.9.4.0-Holographic-Test-linux-x86_64.zip

      - name: ZIPs als GitHub-Actions-Testdownloads bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Vitalux-v0.9.4.0-Holographic-Test
          path: dist/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
