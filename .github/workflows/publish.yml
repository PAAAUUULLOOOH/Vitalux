name: Vitalux – Automatische Veröffentlichung

# The named publish commit is authorized to run the release on main.
# Ordinary source pushes do not publish; workflow_dispatch is also available. MiniHUD, Diagnostic Center guide, quiet shutdown, and staged diagnostic UI imports are regression-tested.
on:
  # Full English guide audit and category-aware Qt regression checks.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'

permissions:
  contents: write

concurrency:
  group: vitalux-publication-stable
  cancel-in-progress: true

jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'publish Vitalux v0.9.4.9')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Quellcode abrufen
        uses: actions/checkout@v4
      - name: Python-Syntax und experimentelle Display-Profile prüfen
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q vitalux tests scripts
          PYTHONPATH="$PWD" python3 tests/test_display_backends.py
      - name: Release-Freigabe, Versionsfolge und einmaligen Bootstrap prüfen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Never publish from a feature branch or recreate an existing release.
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'Only main can be published'; exit 1;
          }
          test -f vitalux/__init__.py
          VERSION="$(python3 -c 'import ast; t=ast.parse(open("vitalux/__init__.py",encoding="utf-8").read()); print(next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=="__version__" for x in n.targets)))')"
          python3 -c 'import sys; sys.path.insert(0,"scripts"); import versioning; versioning.parse(sys.argv[1])' "$VERSION"
          TAG="v${VERSION}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version when ready for a new release."
            exit 1
          fi
          PREVIOUS_TAG="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [[ -z "$PREVIOUS_TAG" ]]; then
            # One-time bootstrap. The old GitHub repository must first be renamed
            # to Vitalux-Archiv, and must not be deleted before THIS run passes.
            [[ "$VERSION" == '0.9.4.0' ]] || {
              echo 'An empty repo may only publish the v0.9.4.0 bootstrap.'; exit 1;
            }
            BASELINE_REPO='PAAAUUULLOOOH/Vitalux-Archiv'
            BASELINE_TAG='v0.9.3.82'
            gh release view "$BASELINE_TAG" --repo "$BASELINE_REPO" >/dev/null || {
              echo 'Keep Vitalux-Archiv and its v0.9.3.82 release accessible until v0.9.4.0 has been published.'
              exit 1
            }
          else
            python3 scripts/versioning.py verify "$PREVIOUS_TAG" "$VERSION"
            BASELINE_REPO="$GITHUB_REPOSITORY"
            BASELINE_TAG="$PREVIOUS_TAG"
          fi
          echo "BASELINE_REPO=$BASELINE_REPO" >> "$GITHUB_ENV"
          echo "BASELINE_TAG=$BASELINE_TAG" >> "$GITHUB_ENV"
          echo "PREVIOUS_VERSION=${BASELINE_TAG#v}" >> "$GITHUB_ENV"
      - name: Gepackte Laufzeit aus dem Vorgänger-Release laden
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/baseline
          ZIP="Vitalux-${BASELINE_TAG}-linux-x86_64.zip"
          if ! gh release view "$BASELINE_TAG" --repo "$BASELINE_REPO" --json assets \
              --jq '.assets[].name' | grep -Fxq "$ZIP"; then
            ZIP="Vitalux-${BASELINE_TAG}-linux-x86_64-Portabel.zip"
          fi
          gh release download "$BASELINE_TAG" --repo "$BASELINE_REPO" \
            --pattern "$ZIP" --dir build
          unzip -tq "build/$ZIP"
          unzip -q "build/$ZIP" -d build/baseline
          test -x "build/baseline/Vitalux-${BASELINE_TAG}/runtime/bin/python3.12"
          test -f "build/baseline/Vitalux-${BASELINE_TAG}/bin/fio.real"
      - name: Vollständiges Programm aus Repository-Quellcode zusammensetzen
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="build/baseline/Vitalux-${BASELINE_TAG}"
          DEST="build/staged/Vitalux-${TAG}"
          mkdir -p build/staged
          cp -a "$SOURCE" "$DEST"
          rm -rf "$DEST/vitalux" "$DEST/assets" "$DEST/.github"
          cp -a vitalux assets "$DEST/"
          cp README.md run.sh Portable-pruefen.sh CHANGELOG.md CHANGELOG.en.md "$DEST/"
          mkdir -p "$DEST/bin" "$DEST/packaging"
          cp bin/fio "$DEST/bin/fio"
          # Previous portable versions could include a privileged GPU tuner.
          # The read-only monitor deliberately excludes it from new packages.
          rm -f "$DEST/bin/vitalux-gpu-engine"
          rm -f "$DEST/packaging/vitalux-gpu-service.py"
          rm -f "$DEST/LICENSES/LACT-MIT.txt"
          cp packaging/build-appimage.sh "$DEST/packaging/build-appimage.sh"
          find "$DEST" -type d -name __pycache__ -prune -exec rm -rf {} +
          python3 -m compileall -q vitalux
          python3 - <<'PY'
          import pathlib, os
          root = pathlib.Path('build/staged') / ('Vitalux-' + os.environ['TAG'])
          assert (root/'vitalux/__main__.py').is_file()
          assert (root/'assets/vitalux.svg').is_file()
          assert (root/'runtime/bin/python3.12').is_file()
          assert (root/'bin/fio.real').is_file()
          assert (root/'packaging/build-appimage.sh').is_file()
          assert (root/'CHANGELOG.en.md').is_file()
          print('Vitalux source and runtime package assembled')
          PY
      - name: OpenGL-Bausteine in die portable Qt-Laufzeit integrieren
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          PY="$STAGED/runtime/bin/python3.12"
          LIB="$STAGED/lib"
          if LD_LIBRARY_PATH="$LIB" "$PY" -c "from PySide6.QtOpenGLWidgets import QOpenGLWidget" 2>/dev/null; then
            echo "PySide6.QtOpenGLWidgets already included in baseline."
          else
            VERSION="$(LD_LIBRARY_PATH="$LIB" "$PY" -c 'import PySide6; print(PySide6.__version__)')"
            mkdir -p build/addons
            python3 -m pip download --only-binary=:all: --no-deps \
              "PySide6_Essentials==${VERSION}" -d build/addons
            WHEEL="$(find build/addons -maxdepth 1 -type f -name '*.whl' -print -quit)"
            test -n "$WHEEL"
            python3 scripts/bundle-opengl-runtime.py "$WHEEL" "$STAGED"
          fi
          LD_LIBRARY_PATH="$LIB" "$PY" -c "from PySide6.QtOpenGLWidgets import QOpenGLWidget; print('OpenGL Qt module imported successfully')"
      - name: Qt Quick GPU-Scene-Graph in die portable Laufzeit integrieren
        shell: bash
        run: |
          set -euo pipefail
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          PY="$STAGED/runtime/bin/python3.12"
          LIB="$STAGED/lib"
          if LD_LIBRARY_PATH="$LIB" "$PY" -c "from PySide6.QtQuickWidgets import QQuickWidget; from PySide6.QtQuick import QQuickImageProvider" 2>/dev/null; then
            echo "Qt Quick bindings already included in this runtime."
          else
            VERSION="$(LD_LIBRARY_PATH="$LIB" "$PY" -c 'import PySide6; print(PySide6.__version__)')"
            mkdir -p build/addons
            WHEEL="$(find build/addons -maxdepth 1 -name '*essentials*.whl' -print -quit)"
            if [[ -z "$WHEEL" ]]; then
              python3 -m pip download --only-binary=:all: --no-deps "PySide6_Essentials==${VERSION}" -d build/addons
              WHEEL="$(find build/addons -maxdepth 1 -name '*essentials*.whl' -print -quit)"
            fi
            test -n "$WHEEL"
            python3 scripts/bundle-quick-runtime.py "$WHEEL" "$STAGED"
          fi
          echo "Qt Quick shared library dependencies:"
          ldd "$STAGED/runtime/lib/python3.12/site-packages/PySide6/QtQuick.abi3.so" | grep -E 'not found|Qt6Quick|Qt6Qml|Qt6Network' || true
          LD_LIBRARY_PATH="$LIB" "$PY" - <<'PY'
          import importlib
          for name in ('QtNetwork','QtQml','QtQuick','QtQuickWidgets'):
              module = importlib.import_module('PySide6.' + name)
              print('Imported PySide6.' + name, module.__file__)
          PY
          echo "Qt Quick bindings ready"
      - name: Changelog-Version prüfen und Release-Notizen erzeugen
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py "$VERSION" "$RUNNER_TEMP/vitalux-release-notes.md"
          test -s "$RUNNER_TEMP/vitalux-release-notes.md"
      - name: Grafische Qt-Abhängigkeiten für Headless-Tests installieren
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Theme-Wechsel in Qt testen (Glass → Minimal → Glass)
        shell: bash
        run: |
          set -euo pipefail
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          cd "$STAGED"
          QT_QPA_PLATFORM=offscreen \
            LD_LIBRARY_PATH="$PWD/lib" \
            "$PWD/runtime/bin/python3.12" \
            "$GITHUB_WORKSPACE/tests/test_glass_theme_switch.py"
          QT_QPA_PLATFORM=offscreen LD_LIBRARY_PATH="$PWD/lib" \
            "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_backgrounds.py"
          QT_QPA_PLATFORM=offscreen LD_LIBRARY_PATH="$PWD/lib" \
            "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_tray_wallpaper.py"
          QT_QPA_PLATFORM=offscreen LD_LIBRARY_PATH="$PWD/lib" \
            "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_wallpaper_accents.py"
          QT_QPA_PLATFORM=offscreen LD_LIBRARY_PATH="$PWD/lib" \
            "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_scroll_pipeline.py"
          QT_QPA_PLATFORM=offscreen LD_LIBRARY_PATH="$PWD/lib" \
            "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_renderer_backends.py"
          QT_QPA_PLATFORM=offscreen LD_LIBRARY_PATH="$PWD/lib" \
            "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_quick_renderer.py"
      - name: Experimentellen OpenGL-Renderer unter Mesa testen
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-util1 libxcb-shape0
          echo "XCB platform plugin dependency check:"
          find "build/staged/Vitalux-${TAG}" -type f -name 'libqxcb.so' -exec sh -c 'echo "Plugin: $1"; ldd "$1" | grep -E "not found|xcb|xkb" || true' -- {} \;
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          cd "$STAGED"
          QT_DEBUG_PLUGINS=1 QT_QPA_PLATFORM=xcb VITALUX_GL_SMOKE=1 LIBGL_ALWAYS_SOFTWARE=1 \
            LD_LIBRARY_PATH="$PWD/lib" \
            xvfb-run -a "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_renderer_backends.py"
      - name: Qt Quick mit echter Qt RHI/Scene-Graph-Ausgabe unter Mesa prüfen
        shell: bash
        run: |
          set -euo pipefail
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          cd "$STAGED"
          QT_QPA_PLATFORM=xcb VITALUX_QUICK_SMOKE=1 QSG_RHI_BACKEND=opengl LIBGL_ALWAYS_SOFTWARE=1 \
            LD_LIBRARY_PATH="$PWD/lib" \
            xvfb-run -a "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_quick_renderer.py"
      - name: Experimentelles Vulkan-Scene-Graph-Rendering unter Mesa prüfen
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          cd "$STAGED"
          # Lavapipe is a Vulkan CPU ICD for CI only; user hardware uses its own driver.
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$ICD" && test -r "$ICD"
          echo "Vulkan-Lavapipe-ICD: $ICD"
          QT_QPA_PLATFORM=xcb QSG_RHI_BACKEND=vulkan VITALUX_QUICK_API=vulkan \
            VK_ICD_FILENAMES="$ICD" LIBGL_ALWAYS_SOFTWARE=1 \
            LD_LIBRARY_PATH="$PWD/lib" \
            xvfb-run -a "$PWD/runtime/bin/python3.12" -m vitalux.quick_probe
      - name: Native Anleitung und Übersetzungen testen
        shell: bash
        run: |
          set -euo pipefail
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          cd "$STAGED"
          QT_QPA_PLATFORM=offscreen \
            LD_LIBRARY_PATH="$PWD/lib" \
            "$PWD/runtime/bin/python3.12" \
            "$GITHUB_WORKSPACE/tests/test_guide_locale.py"
          QT_QPA_PLATFORM=offscreen LD_LIBRARY_PATH="$PWD/lib" \
            "$PWD/runtime/bin/python3.12" \
            "$GITHUB_WORKSPACE/tests/test_monitoring_ui.py"
          QT_QPA_PLATFORM=offscreen LD_LIBRARY_PATH="$PWD/lib" \
            "$PWD/runtime/bin/python3.12" \
            "$GITHUB_WORKSPACE/tests/test_insight_ui.py"
          QT_QPA_PLATFORM=offscreen LD_LIBRARY_PATH="$PWD/lib" \
            "$PWD/runtime/bin/python3.12" \
            "$GITHUB_WORKSPACE/tests/test_insight_window.py"
      - name: Dashboard-Logo und themenabhängiges Branding prüfen
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: ${{ runner.temp }}/vitalux-brand-test-config
        run: |
          set -euo pipefail
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          mkdir -p "$XDG_CONFIG_HOME"
          cd "$STAGED"
          LD_LIBRARY_PATH="$PWD/lib" \
            "$PWD/runtime/bin/python3.12" \
            "$GITHUB_WORKSPACE/tests/test_dashboard_brand.py"
      - name: Einstellungen und Changelog in Qt testen
        timeout-minutes: 8
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: ${{ runner.temp }}/vitalux-options-test-config
        run: |
          set -euo pipefail
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          mkdir -p "$XDG_CONFIG_HOME"
          cd "$STAGED"
          LD_LIBRARY_PATH="$PWD/lib" \
            "$PWD/runtime/bin/python3.12" \
            "$GITHUB_WORKSPACE/tests/test_preferences_changelog.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_protected_accents.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_black_glass_accents.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_ultra_eco.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_holographic_theme.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_black_glass_gold.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_gold_palette.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_diagnostic_hud.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_navigation_reorg.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_wallpaper_accent_availability.py"
          LD_LIBRARY_PATH="$PWD/lib" PYTHONPATH="$PWD" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_system_status.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_gpu_history.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_warning_render.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_update_indicators.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_sidebar_position_icons.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_dialog_locale.py"
          LD_LIBRARY_PATH="$PWD/lib" "$PWD/runtime/bin/python3.12" "$GITHUB_WORKSPACE/tests/test_smart_autoload.py"
      - name: Automatische Wiederherstellung und Shell-Starter testen
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash -n run.sh packaging/AppRun packaging/build-appimage.sh packaging/appimage-rollback-watch.sh
          python3 tests/test_update_rollback.py
          python3 tests/test_zip_rollback.py
          python3 tests/test_core_behaviors.py
          python3 tests/test_monitor_insights.py
          python3 tests/test_insight_engine.py
          python3 tests/test_dashboard_tiling.py
          python3 tests/test_versioning.py
          python3 tests/test_log_timestamps.py
      - name: AppImage-Werkzeug bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl squashfs-tools unzip file
          mkdir -p tooling
          curl -fL --retry 3 --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o tooling/appimagetool.AppImage
          chmod 755 tooling/appimagetool.AppImage
          (cd tooling && ./appimagetool.AppImage --appimage-extract >/dev/null)
          test -x tooling/squashfs-root/AppRun
      - name: AppImage erstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bash packaging/build-appimage.sh \
            "build/staged/Vitalux-${TAG}" \
            "$PWD/dist/Vitalux-${TAG}-x86_64.AppImage" \
            "$PWD/tooling/squashfs-root/AppRun"
          test -s "dist/Vitalux-${TAG}-x86_64.AppImage"
      - name: Installation im isolierten Test-Benutzerverzeichnis prüfen
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$PWD/dist/Vitalux-${TAG}-x86_64.AppImage"
          mkdir -p verify
          (cd verify && "$IMAGE" --appimage-extract >/dev/null)
          EXTRACT="$PWD/verify/squashfs-root"
          bash -n "$EXTRACT/AppRun"
          bash -n "$EXTRACT/packaging/appimage-integration.sh"
          TMP_HOME="$(mktemp -d)"
          HOME="$TMP_HOME" APPDIR="$EXTRACT" APPIMAGE="$IMAGE" bash "$EXTRACT/AppRun" --install
          test -x "$TMP_HOME/.local/opt/vitalux/Vitalux.AppImage"
          test -f "$TMP_HOME/.local/share/applications/vitalux.desktop"
          HOME="$TMP_HOME" APPDIR="$EXTRACT" APPIMAGE="$IMAGE" bash "$EXTRACT/AppRun" --uninstall
          test ! -e "$TMP_HOME/.local/share/applications/vitalux.desktop"
      - name: Vollversion, Differenzupdate und Prüfsummen erstellen
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/create-release-archives.py \
            "build/staged/Vitalux-${TAG}" \
            "build/baseline/Vitalux-${BASELINE_TAG}" \
            dist "$PREVIOUS_VERSION"
          (cd dist && sha256sum *.AppImage *.zip > "Vitalux-${TAG}-SHA256SUMS.txt")
          unzip -tq "dist/Vitalux-${TAG}-linux-x86_64.zip"
      - name: Build-Artefakte zum Prüfen aufbewahren
        uses: actions/upload-artifact@v4
        with:
          name: Vitalux-${{ env.TAG }}-Release
          path: dist/*
          retention-days: 30
      - name: Neuen Release mit fertigen Dateien veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --title "Vitalux $TAG" \
            --notes-file "$RUNNER_TEMP/vitalux-release-notes.md" \
            --latest
          gh release view "$TAG" --json assets --jq '.assets[].name'
