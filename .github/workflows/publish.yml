name: Vitalux – Stable release

# The named main commit is the authorized release. Every package is validated.
# Ordinary source pushes do not publish.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml', 'vitalux/__init__.py']

permissions:
  contents: write
  actions: write
concurrency:
  group: vitalux-publication-stable
  cancel-in-progress: true

jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'publish Vitalux v')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Check release version and predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          VERSION="$(python -c 'from vitalux import __version__; print(__version__)')"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace it."
            exit 1
          fi
          PREVIOUS_TAG="$(gh release view --json tagName --jq '.tagName')"
          python scripts/versioning.py verify "$PREVIOUS_TAG" "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"
          echo "PREVIOUS_VERSION=${PREVIOUS_TAG#v}" >> "$GITHUB_ENV"
          python scripts/release_notes.py "$VERSION" "$RUNNER_TEMP/vitalux-release-notes.md"
      - name: Install pinned build dependencies and virtual graphics drivers
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y xvfb weston libegl1 libgl1 libopengl0 libgl1-mesa-dri libglx-mesa0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-util1 libxcb-shape0 curl squashfs-tools unzip file
          python -m compileall -q vitalux tests scripts packaging
          bash -n run.sh packaging/AppRun packaging/build-appimage.sh packaging/appimage-integration.sh packaging/appimage-rollback-watch.sh
      - uses: actions/cache@v4
        with:
          path: build/downloads
          key: vitalux-baseline-v1-${{ env.PREVIOUS_TAG }}-linux-x86_64
      - name: Download and verify the official predecessor runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/baseline build/downloads
          gh release download "$PREVIOUS_TAG" --pattern "Vitalux-${PREVIOUS_TAG}-SHA256SUMS.txt" --dir build/downloads --clobber
          if [[ ! -s "build/downloads/Vitalux-${PREVIOUS_TAG}-linux-x86_64.zip" ]]; then
            gh release download "$PREVIOUS_TAG" --pattern "Vitalux-${PREVIOUS_TAG}-linux-x86_64.zip" --dir build/downloads
          fi
          python - <<'PY'
          import hashlib, os, pathlib, sys
          root = pathlib.Path('build/downloads')
          tag = os.environ['PREVIOUS_TAG']
          archive = root/f'Vitalux-{tag}-linux-x86_64.zip'
          manifest = (root/f'Vitalux-{tag}-SHA256SUMS.txt').read_text()
          expected = next(line.split()[0] for line in manifest.splitlines() if line.split()[-1].lstrip('*') == archive.name)
          with archive.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == expected, 'Official baseline SHA-256 mismatch'
          sys.path.insert(0, 'scripts')
          from distribution_tools import extract_release_zip
          extract_release_zip(archive, pathlib.Path('build/baseline'))
          PY
      - name: Assemble the stable portable package
        run: |
          set -euo pipefail
          python scripts/prepare-release.py "build/staged/Vitalux-${TAG}"
          python scripts/check-distribution.py "build/staged/Vitalux-${TAG}"
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          LD_LIBRARY_PATH="$STAGED/lib" "$STAGED/runtime/bin/python3.12" -c 'from PySide6.QtQuickWidgets import QQuickWidget; from PySide6.QtTest import QTest; import psutil'
      - name: Run every regression with the shipped Python and Qt and expose failures
        run: |
          set -euo pipefail
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          cd "$STAGED"
          LD_LIBRARY_PATH="$STAGED/lib" "$STAGED/runtime/bin/python3.12" scripts/run-regressions.py --output "$GITHUB_WORKSPACE/build/regressions"
      - name: Check resource budgets, endurance and reference rendering
        timeout-minutes: 18
        run: |
          set -euo pipefail
          python scripts/check-resource-budgets.py
          python scripts/check-ui-endurance.py --cycles 180 --output build/ui-endurance
          git worktree add --detach build/render-reference 5bcc1e90a69f3f58f1de582db0b5eeec5b0e4332
          python scripts/check-render-parity.py --reference build/render-reference --output build/render-parity
          git worktree remove build/render-reference
      - name: Check real component pictures and offline reuse
        run: python scripts/check-product-image-network.py --require-all-components
      - name: Check real manufacturer datasheets and offline reuse
        run: python scripts/check-product-spec-network.py --require-all-components
      - name: Check real DE/EN datasheet translation and offline reuse
        run: python scripts/check-spec-translation-network.py
      - name: Check kernel traffic accounting and session blocks in the disposable runner VM
        run: |
          set -euo pipefail
          sudo env VITALUX_NETWORK_TEST_VM=1 /usr/bin/python3 scripts/check-network-kernel.py | tee build/network-kernel.log
      - name: Check CPU and X11 rendering in isolated compositor sessions
        id: graphics
        run: |
          set -euo pipefail
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          cd "$STAGED"
          LD_LIBRARY_PATH="$STAGED/lib" "$STAGED/runtime/bin/python3.12" scripts/run-graphics-checks.py --output "$GITHUB_WORKSPACE/build/graphics-checks"
      - name: Expose native validation failures for diagnosis
        if: failure() && steps.graphics.outcome == 'failure'
        run: |
          mkdir -p build/graphics-checks
          sudo dmesg | tail -n 35 > build/graphics-checks/kernel.log || true
          python - <<'PY'
          from pathlib import Path
          logs = list(Path('build/graphics-checks').glob('*.log'))
          for log in sorted(logs):
              tail = '\n'.join(log.read_text(errors='replace').splitlines()[-18:])
              escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title={log.name}::{escaped}', flush=True)
          PY
      - name: Verify source ZIP startup without system Python
        run: python scripts/check-source-startup.py
      - name: Check fractional-scale settings layouts
        run: |
          set -euo pipefail
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          cd "$STAGED"
          for DESIGN in obsidian_gold glass light crystal_atrium nebula_prism quantum_core eclipse_crystal minimal; do
            LD_LIBRARY_PATH="$STAGED/lib" "$STAGED/runtime/bin/python3.12" scripts/capture-release-ui.py --output "$GITHUB_WORKSPACE/build/ui-scale-checks/$DESIGN" --design "$DESIGN" --scales 1,1.25,1.5,2
          done
      - name: Prepare AppImage tooling
        run: |
          set -euo pipefail
          mkdir -p tooling
          curl -fL --retry 3 --silent --show-error https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o tooling/appimagetool.AppImage
          chmod 755 tooling/appimagetool.AppImage
          (cd tooling && ./appimagetool.AppImage --appimage-extract >/dev/null)
      - name: Build and test AppImage desktop integration
        run: |
          set -euo pipefail
          mkdir -p dist verify
          STAGED="$PWD/build/staged/Vitalux-${TAG}"
          python scripts/finalize-package.py "$STAGED"
          python scripts/check-distribution.py "$STAGED"
          IMAGE="$PWD/dist/Vitalux-${TAG}-x86_64.AppImage"
          bash packaging/build-appimage.sh "build/staged/Vitalux-${TAG}" "$IMAGE" "$PWD/tooling/squashfs-root/AppRun"
          (cd verify && "$IMAGE" --appimage-extract >/dev/null)
          EXTRACT="$PWD/verify/squashfs-root"
          PROFILE="$(mktemp -d)"
          export VITALUX_INTEGRATION_ROOT="$PROFILE/user space"
          export XDG_DATA_HOME="$PROFILE/data" XDG_STATE_HOME="$PROFILE/state"
          APPDIR="$EXTRACT" APPIMAGE="$IMAGE" bash "$EXTRACT/AppRun" --install
          test -x "$VITALUX_INTEGRATION_ROOT/.local/opt/vitalux/Vitalux.AppImage"
          test -f "$XDG_DATA_HOME/applications/vitalux.desktop"
          bash -n "$VITALUX_INTEGRATION_ROOT/.local/bin/vitalux"
          APPDIR="$EXTRACT" APPIMAGE="$IMAGE" bash "$EXTRACT/AppRun" --uninstall
          test ! -e "$XDG_DATA_HOME/applications/vitalux.desktop"
      - uses: actions/cache@v4
        with:
          path: build/third-party-sources
          key: vitalux-third-party-sources-v1-${{ hashFiles('third_party/sources.lock.json') }}
      - name: Build full and manual update ZIPs with checksums
        run: |
          set -euo pipefail
          python scripts/create-release-archives.py "build/staged/Vitalux-${TAG}" "build/baseline/Vitalux-${PREVIOUS_TAG}" dist "$PREVIOUS_VERSION"
          python scripts/bundle-third-party.py --runtime-root "build/staged/Vitalux-${TAG}" --output dist
          (cd dist && sha256sum *.AppImage *.zip > "Vitalux-${TAG}-SHA256SUMS.txt")
          unzip -tq "dist/Vitalux-${TAG}-linux-x86_64.zip"
          python scripts/check-release-update.py "build/baseline/Vitalux-${PREVIOUS_TAG}" "dist/Vitalux-${TAG}-linux-x86_64.zip"
          python scripts/check-channel-switch.py "dist/Vitalux-${TAG}-linux-x86_64.zip"
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vitalux-${{ env.TAG }}-Validation
          path: |
            build/regressions/
            build/graphics-checks/
            build/product-image-check/
            build/product-spec-check/
            build/spec-language-check/
            build/source-startup-checks/
            build/ui-scale-checks/
            build/network-kernel.log
          retention-days: 30
      - name: Preserve release packages
        uses: actions/upload-artifact@v4
        with:
          name: Vitalux-${{ env.TAG }}-Release
          path: dist/*
          retention-days: 30
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Vitalux $TAG" --notes-file "$RUNNER_TEMP/vitalux-release-notes.md" --latest
          gh release view "$TAG" --json assets --jq '.assets[] | {name, size, digest}'
      - name: Refresh the permanent Unstable branch and build its current test package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name PAAAUUULLOOOH
          git config user.email PAAAUUULLOOOH@users.noreply.github.com
          git fetch --unshallow || true
          python scripts/sync-unstable.py
          gh workflow run unstable.yml --ref refs/heads/unstable
